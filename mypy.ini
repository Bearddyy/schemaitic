# SchemAItic: fail-early ideology. Our code is fully typed and strict.
# SKiDL/InSpice ship no type information (no py.typed), so their symbols are
# treated as Any at the import boundary - everything we write on top of them
# must still be annotated and checked.

[mypy]
python_version = 3.14
strict = True
warn_unreachable = True
disallow_any_explicit = False
pretty = True

# Untyped upstream libraries: Any is allowed to leak only from here.
[mypy-skidl.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-InSpice.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-matplotlib.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-numpy.*]
ignore_missing_imports = True
follow_imports = skip

# Circuit files are user/agent-authored sketches validated at runtime by ERC
# and the rules stage; they get lenient (but still checked) treatment.
[mypy-examples.*]
disallow_untyped_defs = False
